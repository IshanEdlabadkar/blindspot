# Apache (mod_ssl + mod_proxy) in front of a Blind RAG document server: the same job as nginx.conf.
#   a2enmod ssl proxy proxy_http headers rewrite
#   Replace docs.example.org; get the certificate with:  certbot --apache -d docs.example.org
#   (or --webroot as in README.md). Install as /etc/apache2/sites-available/blind-rag.conf, then a2ensite.
# Rate limiting: Apache has no built-in per-client limit as simple as nginx's; turn on the document
# server's own limiter instead (BLIND_RAG_RATE_LIMIT=1, see README.md).

<VirtualHost *:80>
    ServerName docs.example.org
    Alias /.well-known/acme-challenge/ /var/www/certbot/.well-known/acme-challenge/
    <Directory /var/www/certbot>
        Require all granted
    </Directory>
    RewriteEngine on
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName docs.example.org
    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/docs.example.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/docs.example.org/privkey.pem
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLSessionTickets off

    # Privacy: no access log (the document server keeps its own four-field log).
    CustomLog /dev/null common
    LogLevel warn
    ServerSignature Off

    Header always set Strict-Transport-Security "max-age=63072000"
    Header always set X-Content-Type-Options nosniff
    Header always set Referrer-Policy no-referrer

    LimitRequestBody 67108864
    RequestReadTimeout header=10 body=60
    Timeout 300

    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto https
    # Overwrite X-Forwarded-For with the real address, so clients can't spoof it.
    RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}s"
    RequestHeader unset CF-Connecting-IP
    ProxyPass        /v1/ http://127.0.0.1:8080/v1/ timeout=300
    ProxyPassReverse /v1/ http://127.0.0.1:8080/v1/
    <Location />
        Require all granted
    </Location>
</VirtualHost>
