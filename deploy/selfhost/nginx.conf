# nginx in front of a Blind RAG document server on your own machine (VM, lab server, venue box):
# HTTPS with a Let's Encrypt certificate, HTTP -> HTTPS, rate limits, no access log.
# (On Render none of this is needed: Render terminates HTTPS with managed certificates.)
#
#   1. Replace docs.example.org with your domain (DNS pointing at this machine), everywhere below.
#   2. Start the server on loopback only:   ./crypto-server/crypto-server -data artifacts/<id> -addr 127.0.0.1:8080
#   3. Get the certificate:                 see README.md (certbot --webroot), then  nginx -t && systemctl reload nginx
#
# Install as /etc/nginx/conf.d/blind-rag.conf (the limit_req_zone lines must stay at http level, which
# conf.d files are).

# Per-client budgets (in memory, by address). Downloads are the multi-MB hints and fetch store.
limit_req_zone $binary_remote_addr zone=br_questions:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=br_downloads:10m rate=20r/m;
limit_conn_zone $binary_remote_addr zone=br_conns:10m;

server {
    listen 80;
    listen [::]:80;
    server_name docs.example.org;
    access_log off;   # no addresses or paths on disk here either

    location /.well-known/acme-challenge/ { root /var/www/certbot; }   # Let's Encrypt HTTP-01 challenge
    location / { return 301 https://$host$request_uri; }
}

server {
    # 'listen ... ssl http2' works on nginx 1.24 (Ubuntu 24.04); 1.25.1+ prefers a separate 'http2 on;'.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name docs.example.org;

    ssl_certificate     /etc/letsencrypt/live/docs.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docs.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:br_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;          # forward secrecy across sessions

    # Privacy: no access log. The document server keeps its own four-field log
    # (ts, endpoint, response_bytes, latency_ms); nginx would otherwise record every address and path.
    access_log off;
    error_log /var/log/nginx/blind-rag-error.log warn;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 64m;         # the server's own cap (token mode upload); hint mode needs ~4 KB
    client_body_timeout 60s;
    client_header_timeout 10s;
    send_timeout 300s;                # a slow client downloading the 17 MB hint
    limit_conn br_conns 16;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;                  # keeps a non-443 port in the hint URLs
    proxy_set_header X-Forwarded-Proto https;          # so the manifest's hint URLs are https://
    proxy_set_header X-Forwarded-For $remote_addr;     # overwrite, never append: clients can't spoof it
    proxy_set_header CF-Connecting-IP "";
    proxy_read_timeout 300s;
    proxy_buffering off;              # stream the big downloads instead of spooling them to disk

    location ~ ^/v1/(score_hint|fetch_hint|fetch_store)$ {
        limit_req zone=br_downloads burst=12 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
    }
    location /v1/ {
        limit_req zone=br_questions burst=200 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
    }
    location / { return 404; }
}
