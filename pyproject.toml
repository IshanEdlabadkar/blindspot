[project]
name = "blindspot"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.163.1",
    "numpy>=1.26",
    "requests>=2.31",
    "sentence-transformers>=3.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["slow: downloads the embedding model or needs Ollama"]
addopts = "-m 'not slow'"
