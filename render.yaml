# Render Blueprint for the Blind RAG document server. See DEPLOY.md.
services:
  - type: web
    name: blind-rag-server
    runtime: docker
    plan: 0.5c-512mb          # ~210 MB with hint mode + real PIR; the free plan sleeps when idle
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /v1/manifest
    autoDeployTrigger: commit
    envVars:
      - key: BLIND_RAG_TOKEN_MODE
        value: "0"            # hint mode only: fits in 512 MB
      - key: BLIND_RAG_PUBLIC_LOG
        value: "1"            # GET /v1/server_log for the UI's server panel
      - key: BLIND_RAG_DATA_URL
        sync: false           # the provider's corpus storage; set in the Render dashboard (see DEPLOY.md)
      - key: BLIND_RAG_DATA_AUTH
        sync: false           # optional Authorization header for that storage
      - key: BLIND_RAG_DATA_POLL
        value: 1m             # check for a new corpus_version every minute
